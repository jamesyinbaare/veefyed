services:
  fastapi-app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: skin-scanner-app
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - skins_storage_data:/app/storage/skin_images
    command: >
      sh -c "
        if [ -f app/scripts/prestart.sh ]; then
          bash app/scripts/prestart.sh
        fi &&
        uv run fastapi dev app/main.py --host 0.0.0.0 --port 80
      "
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - skins_db_data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB:-skins_db}
    ports:
      - "5432:5432"

volumes:
  skins_db_data:
  skins_storage_data:
